<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JSON-RPC Client</title>
</head>
<body>
    <h1>JSON-RPC Client</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Отправить</button>
    </form>
    {% if response %}
        <h2>Ответ</h2>
        <pre>{{ response|safe }}</pre>
    {% endif %}
    {% if error %}
        <h2>Ошибка</h2>
        <pre>{{ error }}</pre>
    {% endif %}
</body>
</html>
